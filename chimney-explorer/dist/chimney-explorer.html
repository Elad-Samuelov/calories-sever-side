<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chimney Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#fbfaf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chimney Explorer">
<meta name="description" content="An interactive chimney and fireplace guide for explaining parts and repairs to clients.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e8622c'/%3E%3Cpath d='M16 6c1 4 6 6.5 6 12a6 6 0 0 1-12 0c0-3 1.6-4.6 2.8-6 .2 2 1 3 2.2 3.4C14.6 12.5 15.2 9 16 6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* Layout: one calm canvas. The chimney is the hero; everything else steps back. */
:root {
  --ember: #e8622c;
  --ember-deep: #c94c1a;
  --ember-soft: #fdf0e9;
  --ink: #1d1d1f;
  --ink-2: #6e6e73;
  --ink-3: #a1a1a6;
  --line: #e7e5e2;
  --bg: #fbfaf8;
  --card: #ffffff;
  --scrim: rgba(20, 16, 14, .32);
  --shadow: 0 1px 2px rgba(30, 20, 10, .05), 0 8px 30px rgba(30, 20, 10, .08);
  --shadow-lg: 0 20px 60px rgba(30, 20, 10, .18);
  --r: 20px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --ease: cubic-bezier(.32, .72, 0, 1);
  --top: 60px;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font); background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased; font-size: 16px; line-height: 1.5; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- top bar ---------- */
.topbar {
  position: fixed; inset: 0 0 auto; z-index: 30; height: calc(var(--top) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px;
  background: rgba(251, 250, 248, .82); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid rgba(0, 0, 0, .05);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: -.01em; min-width: 0; font-size: 17px; }
.brand svg { flex: none; }
.brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); transition: background .2s; flex: none; }
.icon-btn:hover { background: rgba(0, 0, 0, .05); }
.icon-btn.on { background: var(--ember-soft); color: var(--ember-deep); }
.back { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 10px 0 4px; border-radius: 20px; color: var(--ember-deep); font-weight: 500; flex: none; }
.back:hover { background: var(--ember-soft); }

.seg { display: inline-flex; background: rgba(0, 0, 0, .055); border-radius: 999px; padding: 3px; position: relative; flex: none; }
.seg button { position: relative; z-index: 1; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); transition: color .25s; white-space: nowrap; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg .pill { position: absolute; top: 3px; bottom: 3px; border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); transition: left .35s var(--ease), width .35s var(--ease); }
.seg.sm button { height: 28px; padding: 0 12px; font-size: 13px; }

.owner-bar {
  position: fixed; z-index: 29; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 14px; border-radius: 999px;
  background: var(--ink); color: #fff; font-size: 13px; box-shadow: var(--shadow-lg); white-space: nowrap; max-width: calc(100vw - 24px);
}
.owner-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ember); flex: none; }
.owner-bar .txt { overflow: hidden; text-overflow: ellipsis; }
.owner-bar button { height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(255, 255, 255, .14); font-size: 13px; font-weight: 500; flex: none; }
.owner-bar button:hover { background: rgba(255, 255, 255, .24); }

/* ---------- screens ---------- */
.screen { position: fixed; inset: calc(var(--top) + env(safe-area-inset-top, 0px)) 0 0; overflow: auto; transition: opacity .4s var(--ease), transform .5s var(--ease); }
.screen[aria-hidden="true"] { opacity: 0; pointer-events: none; transform: scale(.985); }

/* home */
.home { padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.home-inner { max-width: 1100px; margin: 0 auto; padding-top: clamp(28px, 7vh, 80px); }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ember-deep); font-weight: 600; }
.home h1 { font-size: clamp(32px, 5.6vw, 58px); line-height: 1.04; letter-spacing: -.035em; font-weight: 700; margin-top: 10px; max-width: 14ch; }
.home .sub { font-size: clamp(17px, 2vw, 21px); color: var(--ink-2); margin: 14px 0 0; max-width: 40ch; letter-spacing: -.01em; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: clamp(28px, 5vh, 56px); }
.card {
  text-align: left; background: var(--card); border-radius: 26px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
  transition: transform .45s var(--ease), box-shadow .45s var(--ease); animation: rise .7s var(--ease) both;
}
.card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 2px 4px rgba(30, 20, 10, .05), 0 22px 50px rgba(30, 20, 10, .14); }
.card:active { transform: scale(.985); }
.card .thumb { height: 250px; background: #f3efea; position: relative; overflow: hidden; }
.card .thumb svg, .card .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card h2 { font-size: 22px; letter-spacing: -.02em; font-weight: 650; }
.card p { margin: 0; color: var(--ink-2); font-size: 15px; line-height: 1.45; }
.card .go { margin-top: auto; padding-top: 12px; color: var(--ember-deep); font-weight: 500; font-size: 15px; display: flex; align-items: center; gap: 4px; }
.home-foot { margin-top: 36px; color: var(--ink-3); font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* explorer */
.explorer { display: flex; flex-direction: column; overflow: hidden; }
.ex-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); transition: padding .5s var(--ease); }
.ex-head h1 { font-size: clamp(22px, 3.2vw, 30px); letter-spacing: -.025em; font-weight: 700; line-height: 1.1; margin-top: 4px; }
.ex-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip-btn { height: 34px; padding: 0 14px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); font-size: 13.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); white-space: nowrap; }
.chip-btn:hover { box-shadow: inset 0 0 0 1px #d3d0cc; }
.chip-btn.on { background: var(--ember-soft); box-shadow: inset 0 0 0 1px #f6c9b2; color: var(--ember-deep); }
.chip-btn.dark { background: var(--ink); color: #fff; box-shadow: none; }
.stage-wrap { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; transition: padding .5s var(--ease); }
.stage { position: relative; border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); background: #fff; touch-action: manipulation; animation: rise .6s var(--ease) both; }
.stage > .art, .stage > .art svg, .stage > .art img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage > .art img { object-fit: cover; }
.stage .hit { fill: transparent; stroke: transparent; cursor: pointer; transition: fill .3s, stroke .3s; vector-effect: non-scaling-stroke; }
.stage .hit:hover { fill: rgba(232, 98, 44, .12); stroke: rgba(232, 98, 44, .7); stroke-width: 1.5; }
.stage .hit.on { fill: rgba(232, 98, 44, .2); stroke: var(--ember); stroke-width: 2.5; }
.stage .hit.intro { animation: introHit 1.1s ease both; }
@keyframes introHit { 0%, 100% { fill: transparent; stroke: transparent; } 40% { fill: rgba(232, 98, 44, .16); stroke: rgba(232, 98, 44, .8); stroke-width: 1.5; } }
.stage.moving .hit { pointer-events: none; }

.hs { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; display: grid; place-items: center; z-index: 2; }
.hs .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 0 3px #fff, 0 2px 8px rgba(0, 0, 0, .35); position: relative; transition: transform .3s var(--ease); }
.hs .dot::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid rgba(232, 98, 44, .8); animation: pulse 2.6s ease-out infinite; }
.hs:hover .dot, .hs.on .dot { transform: scale(1.25); }
.hs.on .dot { background: #fff; box-shadow: 0 0 0 4px var(--ember), 0 2px 10px rgba(0, 0, 0, .35); }
.hs .lbl {
  position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap; pointer-events: none;
  background: rgba(255, 255, 255, .94); color: var(--ink); font-size: 12.5px; font-weight: 600; letter-spacing: -.005em;
  padding: 5px 10px; border-radius: 999px; box-shadow: 0 2px 10px rgba(0, 0, 0, .16); transition: opacity .3s, transform .3s var(--ease);
}
.hs .lbl.r { left: 38px; } .hs .lbl.l { right: 38px; }
.stage.no-labels .hs .lbl { opacity: 0; transform: translateY(-50%) scale(.95); }
.stage.no-labels .hs:hover .lbl, .stage.no-labels .hs.on .lbl { opacity: 1; transform: translateY(-50%); }
.hs.on .lbl { background: var(--ember); color: #fff; }
.stage.moving .hs { cursor: grab; touch-action: none; }
.stage.moving .hs .dot { background: #fff; box-shadow: 0 0 0 3px var(--ember), 0 2px 8px rgba(0, 0, 0, .35); }
.stage.moving .hs .dot::after { animation: none; border-style: dashed; inset: -9px; }
@keyframes pulse { 0% { transform: scale(1); opacity: .9; } 80%, 100% { transform: scale(2.4); opacity: 0; } }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); flex: none; transition: padding .5s var(--ease); }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; height: 40px; padding: 0 16px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 500; transition: background .25s, color .25s, box-shadow .25s; }
.chips button:hover { box-shadow: inset 0 0 0 1px #d3d0cc; }
.chips button.on { background: var(--ink); color: #fff; box-shadow: none; }

/* flame flicker */
.fl { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.6s ease-in-out infinite alternate; }
.fl1 { animation-duration: 1.2s; } .fl2 { animation-duration: 1.9s; animation-delay: -.4s; } .fl3 { animation-duration: 1.4s; animation-delay: -.8s; }
.glow { animation: glow 2.4s ease-in-out infinite alternate; }
.smoke { animation: drift 5s ease-in-out infinite alternate; }
.smoke-dash { animation: dash 1.6s linear infinite; }
@keyframes flick { 0% { transform: scale(1, 1) skewX(0); } 50% { transform: scale(.94, 1.08) skewX(2deg); } 100% { transform: scale(1.04, .92) skewX(-2deg); } }
@keyframes glow { from { opacity: .75; } to { opacity: 1; } }
@keyframes drift { from { transform: translateX(-3px); opacity: .7; } to { transform: translateX(3px); opacity: 1; } }
@keyframes dash { to { stroke-dashoffset: -22; } }

/* ---------- sheet / panel ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .45s var(--ease); }
.scrim.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 88vh; max-height: 88dvh; background: var(--card);
  border-radius: 26px 26px 0 0; box-shadow: var(--shadow-lg); transform: translateY(105%); transition: transform .5s var(--ease);
  display: flex; flex-direction: column; overscroll-behavior: contain;
}
.sheet.show { transform: none; }
.sheet .grip { flex: none; height: 26px; display: grid; place-items: center; cursor: grab; touch-action: none; }
.sheet .grip::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: #d8d5d1; }
.sheet .scroll { overflow-y: auto; padding: 0 max(22px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); -webkit-overflow-scrolling: touch; }
.sheet .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: sticky; top: 0; background: var(--card); padding: 4px 0 10px; z-index: 2; }
.sheet .close { width: 34px; height: 34px; border-radius: 50%; background: rgba(0, 0, 0, .06); display: grid; place-items: center; flex: none; }
.sheet .close:hover { background: rgba(0, 0, 0, .1); }
.sheet h2 { font-size: clamp(28px, 4vw, 36px); letter-spacing: -.03em; font-weight: 700; line-height: 1.08; }
.sheet .tagline { font-size: 18px; color: var(--ink-2); margin: 6px 0 0; letter-spacing: -.01em; }
.sec { margin-top: 28px; }
.sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); font-weight: 600; margin-bottom: 10px; }
.sec p { margin: 0 0 12px; font-size: 16.5px; line-height: 1.6; color: #2c2c2e; max-width: 62ch; }
.problems { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.problems li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #f0eeeb; font-size: 16px; line-height: 1.45; }
.problems li:last-child { border-bottom: 0; }
.problems li::before { content: ""; flex: none; width: 7px; height: 7px; margin-top: 8px; border-radius: 50%; background: var(--ember); }
.service { background: var(--ember-soft); border-radius: 20px; padding: 20px 22px 10px; }
.service h3 { color: var(--ember-deep); }
.service p { color: #3b2a22; }
.cta { display: inline-flex; align-items: center; gap: 8px; margin: 2px 0 12px; height: 44px; padding: 0 18px; border-radius: 999px; background: var(--ember); color: #fff; font-weight: 600; text-decoration: none; font-size: 15px; }
.cta:hover { background: var(--ember-deep); }
.sheet-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
.sheet-nav button { height: 44px; padding: 0 16px; border-radius: 999px; font-weight: 500; color: var(--ink); display: inline-flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, .045); min-width: 0; }
.sheet-nav button:hover { background: rgba(0, 0, 0, .08); }
.sheet-nav button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.owner-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

/* ---------- gallery ---------- */
.gal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.gal-head h3 { margin: 0; }
.empty { border: 1.5px dashed #e2ddd7; border-radius: 20px; padding: 30px 20px; text-align: center; color: var(--ink-2); display: grid; justify-items: center; gap: 6px; }
.empty .ic { width: 46px; height: 46px; border-radius: 50%; background: #f5f2ee; display: grid; place-items: center; color: var(--ink-3); margin-bottom: 4px; }
.empty b { color: var(--ink); font-weight: 600; font-size: 16px; }
.empty span { font-size: 14px; }
.pairs { display: grid; gap: 22px; }
.pair .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.media { position: relative; border-radius: 14px; overflow: hidden; background: #f1eee9; aspect-ratio: 4 / 3; cursor: zoom-in; display: block; width: 100%; }
.media img, .media video { width: 100%; height: 100%; object-fit: cover; display: block; }
.media .tag, .ba .tag { position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.media .tag.after, .ba .tag.after { background: var(--ember); }
.media .play { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.media .play i { width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, .9); display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
.caption { font-size: 14px; color: var(--ink-2); margin-top: 8px; line-height: 1.45; }
.singles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
.ba { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; background: #f1eee9; user-select: none; touch-action: pan-y; }
.ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.ba .b { clip-path: inset(0 calc(100% - var(--pos, 50%)) 0 0); }
.ba .bar { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 8px rgba(0, 0, 0, .35); pointer-events: none; }
.ba .knob { position: absolute; top: 50%; left: var(--pos, 50%); width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 50%; background: #fff; box-shadow: 0 3px 12px rgba(0, 0, 0, .3); display: grid; place-items: center; pointer-events: none; color: var(--ink); }
.ba .tag.after { left: auto; right: 8px; }
.ba input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }

/* owner gallery editor */
.ed-list { display: grid; gap: 12px; }
.ed-item { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px; border-radius: 16px; background: #faf8f6; box-shadow: inset 0 0 0 1px #efebe6; align-items: start; }
.ed-item .media { aspect-ratio: 1; border-radius: 10px; }
.ed-item .fields { display: grid; gap: 8px; min-width: 0; }
.ed-item .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ed-item input[type="text"] { width: 100%; height: 38px; border-radius: 10px; border: 1px solid #e3dfda; padding: 0 12px; background: #fff; font-size: 14.5px; }
.mini { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #fff; box-shadow: inset 0 0 0 1px #e6e2dd; color: var(--ink-2); }
.mini:hover { color: var(--ink); }
.mini.danger:hover { color: #c62828; box-shadow: inset 0 0 0 1px #f2c4c4; }
.mini:disabled { opacity: .35; cursor: default; }
.add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.add-btn { height: 52px; border-radius: 16px; border: 1.5px dashed #e0c3b3; color: var(--ember-deep); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; background: #fffaf7; }
.add-btn:hover { background: var(--ember-soft); }
.hint { font-size: 13px; color: var(--ink-3); margin-top: 10px; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity .3s; }
.modal.show { opacity: 1; pointer-events: auto; }
.modal .bg { position: absolute; inset: 0; background: var(--scrim); }
.modal .box { position: relative; width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow: auto; background: #fff; border-radius: 24px; box-shadow: var(--shadow-lg); padding: 24px; transform: translateY(12px) scale(.98); transition: transform .4s var(--ease); }
.modal.show .box { transform: none; }
.modal h2 { font-size: 24px; letter-spacing: -.02em; }
.modal .lead { color: var(--ink-2); margin: 6px 0 0; font-size: 15px; }
.form { display: grid; gap: 14px; margin-top: 18px; }
.form label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.form input, .form textarea { width: 100%; border: 1px solid #e3dfda; border-radius: 12px; padding: 11px 13px; font-size: 16px; background: #fff; font-weight: 400; color: var(--ink); line-height: 1.45; }
.form textarea { min-height: 96px; resize: vertical; }
.form input:focus, .form textarea:focus { outline: none; border-color: var(--ember); box-shadow: 0 0 0 3px rgba(232, 98, 44, .15); }
.form small { font-weight: 400; color: var(--ink-3); }
.form fieldset { border: 0; padding: 16px 0 0; margin: 4px 0 0; border-top: 1px solid var(--line); display: grid; gap: 12px; }

<script>
/* Chimney Explorer — scene renderers.
   Each scene is drawn twice from the same geometry: a shaded "realistic" render
   and a clean "illustrated" diagram. Hit areas and hotspot positions are shared,
   so both versions stay perfectly aligned. */
(function () {
  'use strict';

  /* ---------- tiny helpers ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const f = (n) => Math.round(n * 100) / 100;
  const pts = (a) => a.map((p) => f(p[0]) + ',' + f(p[1])).join(' ');
  const poly = (a, attr) => `<polygon points="${pts(a)}" ${attr || ''}/>`;
  const rect = (x, y, w, h, attr) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" ${attr || ''}/>`;
  const path = (d, attr) => `<path d="${d}" ${attr || ''}/>`;
  const polyD = (a) => 'M' + a.map((p) => f(p[0]) + ' ' + f(p[1])).join('L') + 'Z';
  const rectD = (x, y, w, h) => polyD([[x, y], [x + w, y], [x + w, y + h], [x, y + h]]);

  let UID = 0;
  function makeCtx(real) {
    const pre = 'cx' + (++UID) + '-';
    return { real, id: (n) => pre + n, url: (n) => `url(#${pre}${n})` };
  }

  const INK = '#3a2f2a'; // illustrated outline colour
  const OUT = `stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"`;

  /* ---------- shared defs ---------- */
  function defs(c) {
    const id = c.id;
    if (!c.real) {
      return `<defs>
        <linearGradient id="${id('glow')}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffb066" stop-opacity=".55"/><stop offset="1" stop-color="#ffb066" stop-opacity="0"/></linearGradient>
      </defs>`;
    }
    return `<defs>
      <linearGradient id="${id('sky')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9cad8"/><stop offset=".6" stop-color="#dfe6ea"/><stop offset="1" stop-color="#eceae4"/></linearGradient>
      <linearGradient id="${id('attic')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2d24"/><stop offset="1" stop-color="#5b4836"/></linearGradient>
      <linearGradient id="${id('wall')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7ded2"/><stop offset="1" stop-color="#d6c9b8"/></linearGradient>
      <radialGradient id="${id('roomlight')}" cx=".5" cy=".75" r=".7"><stop offset="0" stop-color="#ffcf9a" stop-opacity=".35"/><stop offset="1" stop-color="#ffcf9a" stop-opacity="0"/></radialGradient>
      <linearGradient id="${id('cavity')}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#140e0b"/><stop offset=".5" stop-color="#2a1f19"/><stop offset="1" stop-color="#120c09"/></linearGradient>
      <linearGradient id="${id('liner')}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d2c16"/><stop offset=".22" stop-color="#b65a31"/><stop offset=".42" stop-color="#e09468"/><stop offset=".55" stop-color="#c46c40"/><stop offset=".85" stop-color="#8a3a1d"/><stop offset="1" stop-color="#5a2210"/></linearGradient>
      <linearGradient id="${id('linerSec')}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9c4a26"/><stop offset="1" stop-color="#c7754a"/></linearGradient>
      <linearGradient id="${id('steel')}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d848c"/><stop offset=".3" stop-color="#e6eaee"/><stop offset=".5" stop-color="#b6bdc4"/><stop offset=".75" stop-color="#eef1f3"/><stop offset="1" stop-color="#6f767e"/></linearGradient>
      <linearGradient id="${id('iron')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b4f55"/><stop offset=".5" stop-color="#25282c"/><stop offset="1" stop-color="#121315"/></linearGradient>
      <linearGradient id="${id('ironH')}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b1d20"/><stop offset=".45" stop-color="#5a5f66"/><stop offset=".6" stop-color="#33373c"/><stop offset="1" stop-color="#141517"/></linearGradient>
      <linearGradient id="${id('alu')}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1f4"/><stop offset=".5" stop-color="#a9b1b9"/><stop offset="1" stop-color="#d7dce1"/></linearGradient>
      <linearGradient id="${id('concrete')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfccc6"/><stop offset="1" stop-color="#8e8a84"/></linearGradient>
      <linearGradient id="${id('parge')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d2826"/><stop offset=".35" stop-color="#6b6560"/><stop offset="1" stop-color="#8d8780"/></linearGradient>
      <linearGradient id="${id('soot')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0a08"/><stop offset="1" stop-color="#3b2c22"/></linearGradient>
      <linearGradient id="${id('stone')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d3ca"/><stop offset="1" stop-color="#a59c90"/></linearGradient>
      <linearGradient id="${id('wood')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a35"/><stop offset=".5" stop-color="#6e4426"/><stop offset="1" stop-color="#4f2f19"/></linearGradient>
      <linearGradient id="${id('glass')}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".35" stop-color="#fff" stop-opacity=".04"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="${id('flame')}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a12"/><stop offset=".5" stop-color="#ff9a2e"/><stop offset="1" stop-color="#ffcf63" stop-opacity=".2"/></linearGradient>
      <linearGradient id="${id('flameIn')}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff1b8"/><stop offset="1" stop-color="#ffc24a" stop-opacity=".1"/></linearGradient>
      <radialGradient id="${id('glow')}" cx=".5" cy=".85" r=".65"><stop offset="0" stop-color="#ffb35c" stop-opacity=".95"/><stop offset=".45" stop-color="#ff7a26" stop-opacity=".45"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
      <linearGradient id="${id('lightL')}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff3e6" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
      <radialGradient id="${id('vignette')}" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient>
      <linearGradient id="${id('shingle')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4d52"/><stop offset="1" stop-color="#2b2d31"/></linearGradient>
      <pattern id="${id('planks')}" patternUnits="userSpaceOnUse" width="120" height="14"><rect width="120" height="14" fill="#9b6a42"/><rect y="0" width="120" height="1" fill="#6e4628"/><rect x="0" y="7" width="120" height="1" fill="#7a4f2e" opacity=".6"/><rect x="40" y="0" width="1" height="7" fill="#5c3a20"/><rect x="95" y="7" width="1" height="7" fill="#5c3a20"/><path d="M0 3.5 Q30 2 60 4 T120 3" stroke="#b07c50" stroke-width=".7" fill="none" opacity=".6"/><path d="M0 10.5 Q40 9 80 11 T120 10" stroke="#84552f" stroke-width=".7" fill="none" opacity=".6"/></pattern>
      <pattern id="${id('mesh')}" patternUnits="userSpaceOnUse" width="5" height="5"><rect width="5" height="5" fill="#1a1c1f" fill-opacity=".25"/><path d="M0 0H5M0 0V5" stroke="#9aa1a8" stroke-width=".9"/></pattern>
      <pattern id="${id('corr')}" patternUnits="userSpaceOnUse" width="10" height="6"><rect width="10" height="6" fill="none"/><rect y="0" width="10" height="2.2" fill="#000" opacity=".22"/><rect y="3.2" width="10" height="1" fill="#fff" opacity=".45"/></pattern>
      <pattern id="${id('insul')}" patternUnits="userSpaceOnUse" width="14" height="10"><rect width="14" height="10" fill="#e7b48f"/><path d="M0 6 Q3.5 1 7 6 T14 6" stroke="#cf9670" stroke-width="1" fill="none"/></pattern>
      <filter id="${id('noise')}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 -1.25 .62"/></filter>
      <filter id="${id('blur2')}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
      <filter id="${id('blur6')}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="${id('blur14')}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
      <filter id="${id('shadow')}" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/></filter>
    </defs>`;
  }

  /* ---------- masonry generators ---------- */
  // Running-bond brick wall clipped to `clipD`. Courses start at oy, columns at ox.
  function bricks(c, key, clipD, box, o) {
    o = o || {};
    const bw = o.bw || 32, bh = o.bh || 11, ox = o.ox != null ? o.ox : box.x, oy = o.oy != null ? o.oy : box.y;
    const cid = c.id('clip-' + key);
    let s = `<clipPath id="${cid}"><path d="${clipD}" clip-rule="evenodd"/></clipPath><g clip-path="url(#${cid})">`;
    const i0 = Math.floor((box.y - oy) / bh) - 1, i1 = Math.ceil((box.y + box.h - oy) / bh) + 1;
    if (c.real) {
      const r = rng(o.seed || 7);
      const hue = o.hue || [6, 18], sat = o.sat || [40, 56], lig = o.lig || [30, 43];
      s += rect(box.x, box.y, box.w, box.h, `fill="${o.mortar || '#a89d90'}"`);
      for (let i = i0; i <= i1; i++) {
        const y = oy + i * bh;
        const shift = (((i % 2) + 2) % 2) ? -bw / 2 : 0;
        let x = ox + shift;
        while (x > box.x) x -= bw;
        for (; x < box.x + box.w; x += bw) {
          let l = lig[0] + r() * (lig[1] - lig[0]);
          if (r() < 0.07) l -= 8;
          const col = `hsl(${f(hue[0] + r() * (hue[1] - hue[0]))},${f(sat[0] + r() * (sat[1] - sat[0]))}%,${f(l)}%)`;
          s += rect(x + 0.8, y + 0.8, bw - 1.6, bh - 1.6, `rx="0.9" fill="${col}"`);
        }
      }
      // bevel: highlight on top edge, shadow on bottom edge of each course
      const pid = c.id('bv-' + key);
      s += `<pattern id="${pid}" patternUnits="userSpaceOnUse" x="${ox}" y="${oy}" width="${bw}" height="${bh}"><rect x="0" y="0.8" width="${bw}" height="1" fill="#fff" opacity=".13"/><rect x="0" y="${bh - 2}" width="${bw}" height="1.2" fill="#000" opacity=".28"/></pattern>`;
      s += rect(box.x, box.y, box.w, box.h, `fill="url(#${pid})"`);
      if (o.dark) s += rect(box.x, box.y, box.w, box.h, `fill="#000" opacity="${o.dark}"`);
      if (o.light !== false) s += rect(box.x, box.y, box.w, box.h, `fill="${c.url('lightL')}"`);
    } else {
      s += rect(box.x, box.y, box.w, box.h, `fill="${o.flat || '#dd7f5f'}"`);
      let d = '';
      for (let i = i0; i <= i1; i++) {
        const y = oy + i * bh;
        d += `M${box.x} ${y}H${box.x + box.w}`;
        const shift = (((i % 2) + 2) % 2) ? -bw / 2 : 0;
        let x = ox + shift;
        while (x > box.x) x -= bw;
        for (; x < box.x + box.w; x += bw) d += `M${x} ${y}V${y + bh}`;
      }
      s += path(d, `stroke="${o.line || '#f6e4d8'}" stroke-width="1.3" fill="none"`);
      if (o.dark) s += rect(box.x, box.y, box.w, box.h, `fill="${INK}" opacity="${o.dark}"`);
    }
    return s + '</g>';
  }

  function joint(ox, k, bw) { return ox + ((k % 2) ? -bw / 2 : 0); }
  // snap to a brick end at or below / at or above a target
  function snapDown(ox, k, bw, target) { let x = joint(ox, k, bw); while (x + bw <= target) x += bw; while (x > target) x -= bw; return x; }
  function snapUp(ox, k, bw, target) { let x = joint(ox, k, bw); while (x < target) x += bw; return x; }

  /* ---------- fire ---------- */
  function flamePath(cx, base, w, h, lean) {
    lean = lean || 0;
    return `M${f(cx - w)} ${f(base)} C${f(cx - w)} ${f(base - h * 0.45)} ${f(cx - w * 0.2 + lean)} ${f(base - h * 0.6)} ${f(cx + lean)} ${f(base - h)} C${f(cx + w * 0.35 + lean)} ${f(base - h * 0.55)} ${f(cx + w)} ${f(base - h * 0.4)} ${f(cx + w)} ${f(base)} Z`;
  }
  function fire(c, cx, base, s) {
    s = s || 1;
    let o = '';
    const logW = 120 * s;
    if (c.real) {
      o += `<ellipse cx="${cx}" cy="${base - 40 * s}" rx="${110 * s}" ry="${80 * s}" fill="${c.url('glow')}" filter="${c.url('blur14')}" class="glow"/>`;
    }
    // grate
    o += rect(cx - 70 * s, base - 6 * s, 140 * s, 5 * s, c.real ? `fill="${c.url('iron')}"` : `fill="${INK}"`);
    o += rect(cx - 64 * s, base - 6 * s, 6 * s, 10 * s, c.real ? `fill="#1a1a1a"` : `fill="${INK}"`) + rect(cx + 58 * s, base - 6 * s, 6 * s, 10 * s, c.real ? `fill="#1a1a1a"` : `fill="${INK}"`);
    // flames
    const fl = [
      [cx - 34 * s, 26 * s, 70 * s, -6 * s], [cx + 6 * s, 30 * s, 92 * s, 4 * s], [cx + 40 * s, 22 * s, 62 * s, 8 * s], [cx - 8 * s, 18 * s, 56 * s, -3 * s]
    ];
    o += '<g class="flames">';
    fl.forEach((q, i) => {
      const base2 = base - 16 * s;
      if (c.real) {
        o += path(flamePath(q[0], base2, q[1], q[2], q[3]), `fill="${c.url('flame')}" filter="${c.url('blur2')}" class="fl fl${i}"`);
      } else {
        o += path(flamePath(q[0], base2, q[1], q[2], q[3]), `fill="#ff7a32" class="fl fl${i}"`);
      }
    });
    fl.forEach((q, i) => {
      const base2 = base - 16 * s;
      o += path(flamePath(q[0], base2, q[1] * 0.55, q[2] * 0.6, q[3]), c.real ? `fill="${c.url('flameIn')}" class="fl fl${i}"` : `fill="#ffc65c" class="fl fl${i}"`);
    });
    o += '</g>';
    // logs
    const logFill = c.real ? c.url('wood') : '#8b5a3c';
    o += `<g transform="rotate(-6 ${cx} ${base - 14 * s})">` + rect(cx - logW / 2, base - 24 * s, logW, 14 * s, `rx="${7 * s}" fill="${logFill}" ${c.real ? '' : OUT}`) + `</g>`;
    o += `<g transform="rotate(7 ${cx} ${base - 12 * s})">` + rect(cx - logW / 2 + 6 * s, base - 18 * s, logW - 10 * s, 13 * s, `rx="${6.5 * s}" fill="${logFill}" ${c.real ? '' : OUT}`) + `</g>`;
    if (c.real) {
      o += `<ellipse cx="${cx}" cy="${base - 10 * s}" rx="${55 * s}" ry="${7 * s}" fill="#ff8a2a" opacity=".55" filter="${c.url('blur2')}"/>`;
      const r = rng(11);
      for (let i = 0; i < 14; i++) o += `<circle cx="${f(cx - 50 * s + r() * 100 * s)}" cy="${f(base - 6 * s - r() * 8 * s)}" r="${f(0.8 + r() * 1.4)}" fill="#ffcf6a" opacity="${f(0.5 + r() * 0.5)}"/>`;
    }
    return o;
  }

  function overlays(c, W, H) {
    if (!c.real) return '';
    return rect(0, 0, W, H, `fill="#000" filter="${c.url('noise')}" opacity=".5" style="mix-blend-mode:multiply" pointer-events="none"`) +
      rect(0, 0, W, H, `fill="${c.url('vignette')}" pointer-events="none"`);
  }

  /* =================================================================
     SCENE 1 — Masonry chimney (front cutaway, roof to hearth)
     ================================================================= */
  function masonry(c) {
    const W = 600, H = 1000, R = c.real;
    const roofY = (x) => 300 + 0.2 * x;
    const OY = 132, BH = 11, BW = 32;
    let o = defs(c);

    // background: sky, attic, room
    o += path(`M0 0H600V${roofY(600)}L0 ${roofY(0)}Z`, `fill="${R ? c.url('sky') : '#eef3f6'}"`);
    o += poly([[0, roofY(0) + 38], [600, roofY(600) + 38], [600, 546], [0, 546]], `fill="${R ? c.url('attic') : '#f4eee7'}"`);
    // attic insulation
    o += rect(0, 526, 600, 20, R ? `fill="${c.url('insul')}"` : `fill="#f6dccd"`);
    if (!R) o += path('M0 526' + Array.from({ length: 30 }, (_, i) => `Q${i * 20 + 10} 518 ${i * 20 + 20} 526`).join(''), `fill="#f6dccd" stroke="${INK}" stroke-width="1.2"`);
    // ceiling
    o += rect(0, 546, 600, 15, R ? `fill="#efe9e1"` : `fill="#ffffff" ${OUT}`);
    if (R) o += rect(0, 559, 600, 2, 'fill="#000" opacity=".12"');
    // room wall
    o += rect(0, 561, 600, 387, `fill="${R ? c.url('wall') : '#faf6f0'}"`);
    if (R) o += rect(0, 561, 600, 387, `fill="${c.url('roomlight')}"`);
    // baseboard + floor
    o += rect(0, 931, 600, 17, R ? 'fill="#f4efe7"' : `fill="#ffffff" ${OUT}`);
    if (R) o += rect(0, 946, 600, 2, 'fill="#000" opacity=".15"');
    o += rect(0, 948, 600, 52, R ? `fill="${c.url('planks')}"` : 'fill="#ecdcc7"');
    if (!R) o += path('M0 962H600M0 976H600M0 990H600M90 948V962M300 962V976M450 948V962M180 976V990M520 976V990', `stroke="#d4bda1" stroke-width="1.2" fill="none"`);
    if (R) o += rect(0, 948, 600, 52, 'fill="#000" opacity=".12"');

    // roof section: shingles, sheathing, rafter
    const band = (a, b) => [[-10, roofY(-10) + a], [610, roofY(610) + a], [610, roofY(610) + b], [-10, roofY(-10) + b]];
    o += poly(band(16, 38), R ? 'fill="#b88a5a"' : `fill="#e8c9a0" ${OUT}`);
    o += poly(band(8, 16), R ? 'fill="#d8b47f"' : `fill="#f3dfbf" ${OUT}`);
    o += poly(band(-2, 8), R ? `fill="${c.url('shingle')}"` : `fill="#5f646b" ${OUT}`);
    if (R) {
      let d = '';
      for (let x = -10; x < 610; x += 14) d += `M${x} ${f(roofY(x) - 2)}L${x + 3} ${f(roofY(x + 3) + 8)}`;
      o += path(d, 'stroke="#18191b" stroke-width="1" opacity=".6"');
      o += poly(band(-2, 0), 'fill="#fff" opacity=".18"');
    }

    // stack + chimney breast (front face)
    const stack = { x: 220, y: OY, w: 160, h: 561 - OY };
    const breast = { x: 140, y: 561, w: 320, h: 925 - 561 };

    // stepped cutaway region, following real brick ends
    const r = rng(42);
    const left = [], right = [];
    let wl = 0, wr = 0;
    for (let k = 1; k <= 51; k++) {
      const y = OY + k * BH;
      const inStack = y < 561;
      const ox = inStack ? 220 : 140;
      let L, Rr;
      // random walk so the broken edge looks hand-demolished, not combed
      if (k % 3 === 1) { wl = Math.max(-1, Math.min(1, wl + (r() < 0.5 ? -1 : 1))); wr = Math.max(-1, Math.min(1, wr + (r() < 0.5 ? -1 : 1))); }
      if (k <= 39) { L = snapDown(ox, k, BW, 252 - wl * 14); Rr = snapUp(ox, k, BW, 348 + wr * 14); }
      else { L = snapDown(ox, k, BW, 200 - Math.abs(wl) * 24); Rr = snapUp(ox, k, BW, 400 + Math.abs(wr) * 24); }
      if (inStack) { L = Math.max(L, 226); Rr = Math.min(Rr, 374); }
      left.push([L, y], [L, y + BH]);
      right.unshift([Rr, y + BH], [Rr, y]);
    }
    const reveal = left.concat(right);
    const revealD = polyD(reveal);
    const opening = [200, 714, 200, 211];
    const openingD = rectD(opening[0], opening[1], opening[2], opening[3]);

    o += bricks(c, 'stack', rectD(stack.x, stack.y, stack.w, stack.h) + revealD, stack, { ox: 220, oy: OY, seed: 3 });
    o += bricks(c, 'breast', rectD(breast.x, breast.y, breast.w, breast.h) + revealD + openingD, breast, { ox: 140, oy: OY, seed: 9 });
    if (!R) o += path(rectD(stack.x, stack.y, stack.w, stack.h) + rectD(breast.x, breast.y, breast.w, breast.h), `fill="none" ${OUT}`);

    // inside the cutaway
    const rid = c.id('reveal');
    o += `<clipPath id="${rid}"><path d="${revealD}"/></clipPath><g clip-path="url(#${rid})">`;
    o += rect(150, 130, 300, 590, R ? `fill="${c.url('cavity')}"` : 'fill="#efe5db"');
    o += bricks(c, 'back', rectD(150, 130, 300, 590), { x: 150, y: 130, w: 300, h: 590 }, { ox: 236, oy: OY + 5, seed: 21, dark: R ? 0.62 : 0.0, flat: '#ecd3c6', line: '#f7ebe3', light: false });
    // smoke chamber
    const sc = [[268, 575], [332, 575], [392, 690], [208, 690]];
    o += poly(sc, R ? `fill="${c.url('parge')}"` : `fill="#c9c1b9" ${OUT}`);
    if (R) {
      o += poly([[268, 575], [300, 575], [300, 690], [208, 690]], 'fill="#fff" opacity=".05"');
      o += path('M290 682 C 280 650, 312 630, 296 600 S 300 585, 300 575', `stroke="#d9d4cf" stroke-width="10" fill="none" opacity=".18" filter="${c.url('blur6')}" class="smoke"/>`);
    } else {
      o += path('M300 680 C 285 650, 318 630, 300 600 S 300 585, 300 578', `stroke="#9a918a" stroke-width="2" stroke-dasharray="5 6" fill="none" class="smoke-dash"/>`);
    }
    // liner (intact clay tile tube)
    o += rect(268, 98, 64, 478, R ? `fill="${c.url('liner')}"` : `fill="#e9a27c" ${OUT}`);
    let jd = '';
    for (let y = 140; y < 575; y += 48) jd += `M268 ${y}H332`;
    o += path(jd, R ? 'stroke="#3d1a0c" stroke-width="2" opacity=".55"' : `stroke="${INK}" stroke-width="1.2"`);
    if (R) o += rect(268, 98, 64, 478, 'fill="#000" opacity=".08"');
    // damper (open plate in throat)
    o += rect(206, 690, 188, 9, R ? `fill="${c.url('iron')}"` : `fill="#45413e" ${OUT}`);
    o += poly([[222, 691], [378, 691], [366, 672], [234, 672]], R ? `fill="${c.url('ironH')}"` : `fill="#6b6662" ${OUT}`);
    o += rect(296, 676, 8, 14, R ? 'fill="#111"' : `fill="${INK}"`);
    o += '</g>';
    // cut edge depth
    if (R) {
      o += `<g clip-path="url(#${rid})">${path(revealD, 'fill="none" stroke="#000" stroke-width="18" opacity=".45" filter="' + c.url('blur6') + '"')}${path(revealD, 'fill="none" stroke="#6a2a16" stroke-width="7"')}${path(revealD, 'fill="none" stroke="#c98a6a" stroke-width="1" opacity=".5"')}</g>`;
    } else {
      o += path(revealD, `fill="none" ${OUT}`);
    }

    // steel lintel
    o += rect(194, 704, 212, 10, R ? `fill="${c.url('iron')}"` : `fill="#4c4844" ${OUT}`);

    // firebox (opening with perspective)
    const fb = c.id('fb');
    o += `<clipPath id="${fb}"><path d="${openingD}"/></clipPath><g clip-path="url(#${fb})">`;
    const back = [[242, 744], [358, 744], [358, 902], [242, 902]];
    const fbBox = { x: 200, y: 714, w: 200, h: 211 };
    const fbOpt = { bw: 28, bh: 10, hue: [24, 34], sat: [38, 52], lig: [52, 66], mortar: '#5d4b3d', flat: '#ecd1ab', line: '#c9a47c', light: false };
    o += bricks(c, 'fbback', polyD(back), fbBox, Object.assign({ ox: 242, oy: 744, seed: 5 }, fbOpt));
    o += bricks(c, 'fbl', polyD([[200, 714], [242, 744], [242, 902], [200, 925]]), fbBox, Object.assign({ ox: 200, oy: 744, seed: 6, dark: R ? 0.35 : 0.08 }, fbOpt));
    o += bricks(c, 'fbr', polyD([[400, 714], [358, 744], [358, 902], [400, 925]]), fbBox, Object.assign({ ox: 200, oy: 744, seed: 8, dark: R ? 0.42 : 0.12 }, fbOpt));
