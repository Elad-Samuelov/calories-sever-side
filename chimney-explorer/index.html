<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chimney Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#fbfaf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chimney Explorer">
<meta name="description" content="An interactive chimney and fireplace guide for explaining parts and repairs to clients.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e8622c'/%3E%3Cpath d='M16 6c1 4 6 6.5 6 12a6 6 0 0 1-12 0c0-3 1.6-4.6 2.8-6 .2 2 1 3 2.2 3.4C14.6 12.5 15.2 9 16 6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/vendor/photoswipe.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <button class="back" id="backBtn" hidden aria-label="Back to fireplace types"></button>
  <div class="brand" id="brand"><span id="brandName">Chimney Explorer</span></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="ownerBtn" aria-label="Owner mode"></button>
</header>

<div class="owner-bar" id="ownerBar" hidden>
  <span class="dot"></span><span class="txt">Owner mode · saves automatically</span>
  <button id="ownerSettings"></button><button id="ownerDone">Done</button>
</div>

<main class="screen home" id="home" aria-hidden="false"></main>

<main class="screen explorer" id="explorer" aria-hidden="true">
  <div class="ex-head">
    <div><div class="eyebrow" id="exEyebrow"></div><h1 id="exTitle">Tap any part to explore</h1></div>
    <div class="ex-tools" id="exTools"></div>
  </div>
  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <div class="zoomer" id="zoomer">
        <div class="art" id="art"></div>
        <div id="hotspots"></div>
      </div>
      <div class="zoom-ctl" id="zoomCtl">
        <button id="zoomIn" aria-label="Zoom in">+</button>
        <button id="zoomOut" aria-label="Zoom out">&minus;</button>
        <button id="zoomReset" aria-label="Reset zoom" hidden>1:1</button>
      </div>
    </div>
  </div>
  <nav class="chips" id="chips" aria-label="Parts"></nav>
</main>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="grip" id="sheetGrip" aria-hidden="true"></div>
  <div class="scroll" id="sheetScroll"></div>
</aside>

<div class="modal" id="modal"></div>
<div class="lightbox" id="lightbox"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/vendor/panzoom.min.js"></script>
<script src="js/vendor/photoswipe.umd.min.js"></script>
<script src="js/vendor/img-comparison-slider.js"></script>
<script src="js/content.js"></script>
<script src="js/scenes.js"></script>
<script src="js/seed.js"></script>
<script src="js/app.js"></script>
</body>
</html>
